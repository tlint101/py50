[project]
name = "py50"
version = "1.2.0"
description = "Generate Dose-Response Curves"
authors = [{ name = "Tony Eight Lin", email = "tonyelin@tmu.edu.tw" }]
requires-python = ">=3.10"
readme = "README.md"
license = "GPL-3.0-only"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.26.4",
    "matplotlib>=3.8.1",
    "scipy>=1.11.3",
    "seaborn>=0.12.2",
    "scikit-posthocs>=0.7.0",
    "pingouin>=0.6.1",
    "statannotations>=0.6.0",
]

[project.optional-dependencies]
# The MCP server. Keeps `pip install py50` a lean scientific library, while
# `pip install 'py50[mcp]'` (or `uvx --from 'py50[mcp]' py50-mcp`) adds the server.
mcp = [
    "fastmcp>=4.0.0",
    "tabulate>=0.9.0",  # DataFrame.to_markdown; otherwise only a transitive dep
]

[project.scripts]
py50-mcp = "py50.mcp_server.server:main"

[dependency-groups]
dev = ["ipykernel>=7.3.0"]

[project.urls]
Repository = "https://github.com/tlint101/py50.git"
Documentation = "https://py50.readthedocs.io/en/latest/"

[tool.uv.build-backend]
module-name = ["py50"]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
